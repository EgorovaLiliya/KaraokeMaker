name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        shell: bash
        env:
          VERSION_CODE: ${{ github.run_number }}
      - name: Report errors
        if: failure()
        shell: bash
        run: |
          grep -hE "^e: |FAILED|AssertionError|expected:|What went wrong" -A3 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          for f in app/build/test-results/*/*.xml; do grep -h -A2 "<failure" "$f" | head -20 | while IFS= read -r l; do echo "::error::$l"; done; done
      - run: cp app/build/outputs/apk/release/app-release.apk KaraokeMaker.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KaraokeMaker-apk
          path: KaraokeMaker.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: KaraokeMaker 0.1.${{ github.run_number }}
          files: KaraokeMaker.apk
          make_latest: true
          body: |
            Скачайте KaraokeMaker.apk и установите на телефон и на Android TV (это один и тот же файл).
